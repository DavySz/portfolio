<!doctype html>
<!-- O idioma real é definido em runtime por src/i18n: o site é bilíngue -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <!-- Uma só: as duas anteriores traziam a mesma cor por media query -->
    <meta name="theme-color" content="#7947DF" />
    <meta name="author" content="Davy de Souza Assuncao" />

    <!-- Poppins é self-hospedada (@font-face em src/index.css), então não há
         mais preconnect: nenhum host de terceiro entra no caminho crítico.
         Só o corte do <h1> é pré-carregado; os outros quatro chegam quando o
         CSS pede. `crossorigin` é obrigatório em preload de fonte, mesmo na
         mesma origem — sem ele o navegador baixa duas vezes. -->
    <link
      rel="preload"
      href="/fonts/poppins-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Favicon and PWA -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon-16x16.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-TileColor" content="#7947DF" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://davysz.com" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Davy de Souza Assunção — Artigos"
      href="/rss.xml"
    />

    <!-- Default Title and Meta (will be updated by useSEO hook) -->
    <title>
      Davy de Souza Assunção | Frontend Engineer & Fintech Specialist
    </title>
    <meta
      name="description"
      content="Frontend Engineer specialized in Fintech. I build high-performance financial interfaces with React, TypeScript and Next.js."
    />
    <meta
      name="keywords"
      content="frontend engineer, fintech developer, react specialist, typescript expert, nextjs, frontend architecture, design systems, financial applications, davy souza, davy assuncao"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://davysz.com/" />
    <meta
      property="og:title"
      content="Davy de Souza Assunção | Frontend Engineer & Fintech Specialist"
    />
    <meta
      property="og:description"
      content="Frontend Engineer specialized in Fintech. I build financial interfaces people trust."
    />
    <meta property="og:image" content="https://davysz.com/images/user.jpeg" />
    <!-- O site abre em inglês; o useSEO troca os dois na mudança de idioma -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta
      property="og:site_name"
      content="Davy de Souza Assunção - Frontend Engineer"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://davysz.com/" />
    <meta
      name="twitter:title"
      content="Davy de Souza Assunção | Frontend Engineer & Fintech Specialist"
    />
    <meta
      name="twitter:description"
      content="Frontend Engineer specialized in Fintech. I build financial interfaces people trust."
    />
    <meta name="twitter:image" content="https://davysz.com/images/user.jpeg" />
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 2rem">
        <h1>JavaScript required</h1>
        <p>This site needs JavaScript to run. Please enable it in your browser.</p>
        <p lang="pt-BR">
          Este site requer JavaScript para funcionar. Habilite o JavaScript no
          seu navegador.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
